version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nexomed_db
    environment:
      POSTGRES_USER: ${PG_USER:-nexomed}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-nexomed_auth}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: nexomed_app
    command: npm start
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.venv
    environment:
      PG_HOST: db
      PORT: 3000
      PG_PORT: 5432
      PG_USER: ${PG_USER:-nexomed}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: ${PG_DATABASE:-nexomed_auth}
      SUPRA_USER: ${SUPRA_USER}
      SUPRA_PASSWORD: ${SUPRA_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL}
      VBA_API_KEY: ${VBA_API_KEY}
      REDISCLOUD_URL: ${REDISCLOUD_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
