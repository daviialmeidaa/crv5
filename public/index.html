<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexomed - HUB</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <meta name="description" content="HUB - Nexomed">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nexo: {
                            50: '#e0f7fa',
                            100: '#b2ebf2',
                            200: '#80deea',
                            300: '#4dd0e1',
                            400: '#26c6da',
                            500: '#0097A7',
                            600: '#00838F',
                            700: '#006064',
                            800: '#004D40',
                            900: '#003330',
                        },
                        steel: {
                            400: '#9ca3af',
                            500: '#6b7280',
                            600: '#4b5563',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    screens: {
                        '3xl': '2560px',
                        '4xl': '3440px',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Animações ── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.7s ease-out forwards;
        }

        .animate-fade-in-up-delay {
            animation: fadeInUp 0.7s 0.15s ease-out forwards;
            opacity: 0;
        }

        .animate-fade-in-up-delay-2 {
            animation: fadeInUp 0.7s 0.3s ease-out forwards;
            opacity: 0;
        }

        .animate-card-in {
            animation: fadeInScale 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* ── Glassmorphism card ── */
        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(255, 255, 255, 0.15) inset;
        }

        /* ── Input focus glow ── */
        .input-nexo:focus {
            box-shadow: 0 0 0 3px rgba(0, 151, 167, 0.15);
        }

        .input-nexo::placeholder {
            color: #9ca3af;
            font-weight: 300;
        }

        /* ── Button shimmer ── */
        .btn-nexo {
            position: relative;
            overflow: hidden;
        }

        .btn-nexo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
        }

        /* 
         * Gradiente de continuidade vertical extraído pixel a pixel
         * da borda direita de login-image.png.
         * Cobre TODA a tela como camada base.
         */
        .bg-image-continuation {
            background: linear-gradient(180deg, 
                #cbe0f5 0%,
                #d6e8f8 10%,
                #ddedfc 20%,
                #e3f1fd 30%,
                #e2f2fd 40%,
                #e1f1fe 50%,
                #d7eafa 60%,
                #d1e5f8 70%,
                #c9dff5 80%,
                #c2dbf3 90%,
                #bad6f1 100%
            );
        }

        /* 
         * Máscara CSS: a borda direita da imagem desaparece gradualmente,
         * revelando o gradiente que está por trás.
         * Usa mask-image para um fade suave de 100% opaco → 0% transparente.
         */
        .image-fade-mask {
            -webkit-mask-image: linear-gradient(to right, 
                black 0%, 
                black 55%, 
                rgba(0,0,0,0.7) 70%, 
                rgba(0,0,0,0.4) 80%, 
                rgba(0,0,0,0.15) 90%, 
                transparent 100%
            );
            mask-image: linear-gradient(to right, 
                black 0%, 
                black 55%, 
                rgba(0,0,0,0.7) 70%, 
                rgba(0,0,0,0.4) 80%, 
                rgba(0,0,0,0.15) 90%, 
                transparent 100%
            );
        }
    </style>
</head>

<body class="h-full font-sans overflow-hidden">

    <!-- ═══════════════════════════════════════════════════════════════════════ -->
    <!-- CAMADA 1: Background                                                  -->
    <!--                                                                       -->
    <!-- Arquitetura:                                                          -->
    <!--   1) Gradiente cobre 100% da viewport como BASE                       -->
    <!--   2) Imagem fica POR CIMA, com mask-image fade-to-transparent         -->
    <!--   3) O gradiente "sangra" naturalmente pela borda da imagem           -->
    <!--   → Resultado: costura invisível em qualquer resolução                -->
    <!-- ═══════════════════════════════════════════════════════════════════════ -->
    <div class="fixed inset-0">
        <!-- Base: gradiente cobrindo toda a viewport -->
        <div class="absolute inset-0 bg-image-continuation"></div>
        <!-- Por cima: imagem com mask fade-to-transparent na borda direita -->
        <div class="absolute inset-y-0 left-0 w-[50%] lg:w-[55%] xl:w-[60%] 2xl:w-[65%] 3xl:w-[58%] 4xl:w-[52%] image-fade-mask">
            <img src="/assets/images/login-image.png" alt=""
                class="absolute inset-0 w-full h-full object-cover object-left"
                aria-hidden="true">
            <!-- Overlay: profundidade nos personagens -->
            <div class="absolute inset-0 bg-gradient-to-r from-steel-900/30 via-transparent to-transparent"></div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <!-- CAMADA 2: Card flutuante                                          -->
    <!--                                                                   -->
    <!-- Card responsivo:                                                  -->
    <!--   1024px  → w-[360px], padding/spacing compacto                   -->
    <!--   1280px  → w-[380px], levemente maior                            -->
    <!--   1920px+ → w-[420px], tamanho padrão                             -->
    <!-- ═══════════════════════════════════════════════════════════════════ -->
    <div class="relative z-10 flex items-center justify-center lg:justify-end min-h-full
                px-4 sm:px-8 lg:px-8 xl:px-14 2xl:px-24 3xl:px-36 4xl:px-48
                py-6">

        <!-- Glass Card — tamanho responsivo -->
        <div class="glass-card relative w-full max-w-md
                    lg:w-[360px] xl:w-[380px] 2xl:w-[420px]
                    rounded-3xl
                    px-7 lg:px-8 2xl:px-11
                    py-8 lg:py-9 2xl:py-11
                    animate-card-in">

            <!-- Accent bar top -->
            <div class="absolute top-0 left-8 right-8 h-1 bg-gradient-to-r from-nexo-500 via-nexo-400 to-nexo-600 rounded-b-full"></div>

            <!-- Logo -->
            <div class="mb-7 lg:mb-7 2xl:mb-9 animate-fade-in-up flex justify-center">
                <img src="/assets/images/logo.png" alt="Nexomed" class="h-9 lg:h-9 2xl:h-11">
            </div>

            <!-- Cabeçalho -->
            <div class="w-full mb-5 lg:mb-5 2xl:mb-7 animate-fade-in-up-delay">
                <h1 class="text-xl lg:text-xl 2xl:text-2xl font-semibold text-steel-800 tracking-tight">Bem-vindo</h1>
                <p class="text-steel-500 text-sm mt-1">Acesse o HUB Nexomed</p>
            </div>

            <!-- Formulário -->
            <form id="loginForm" class="w-full space-y-4 lg:space-y-4 2xl:space-y-5 animate-fade-in-up-delay-2">
                <div>
                    <label for="email"
                        class="block text-xs font-medium text-steel-500 uppercase tracking-wider mb-1.5 2xl:mb-2">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="input-nexo w-full px-3.5 2xl:px-4 py-2.5 2xl:py-3 bg-white/80 border border-gray-200/70 rounded-xl text-steel-800 text-sm outline-none transition-all duration-200 focus:border-nexo-500 focus:bg-white"
                        placeholder="seu@email.com">
                </div>

                <div>
                    <label for="password"
                        class="block text-xs font-medium text-steel-500 uppercase tracking-wider mb-1.5 2xl:mb-2">Senha</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            class="input-nexo w-full px-3.5 2xl:px-4 py-2.5 2xl:py-3 bg-white/80 border border-gray-200/70 rounded-xl text-steel-800 text-sm outline-none transition-all duration-200 focus:border-nexo-500 focus:bg-white pr-12"
                            placeholder="••••••••">
                        <button type="button" id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-steel-400 hover:text-nexo-500 transition-colors"
                            tabindex="-1">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Mensagem de Erro -->
                <div id="errorMessage" class="hidden">
                    <div class="flex items-center gap-2 px-4 py-3 bg-red-50/90 border border-red-100 rounded-xl text-red-600 text-sm backdrop-blur-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                        <span id="errorText">Credenciais inválidas</span>
                    </div>
                </div>

                <!-- Botão de Login -->
                <button type="submit" id="submitBtn"
                    class="btn-nexo w-full bg-nexo-500 hover:bg-nexo-600 text-white font-medium py-2.5 2xl:py-3 px-4 rounded-xl transition-all duration-200 active:scale-[0.98] flex justify-center items-center gap-2 shadow-lg shadow-nexo-500/25 mt-1">
                    <span id="btnText">Entrar</span>
                    <svg id="loadingSpinner" class="animate-spin h-5 w-5 text-white hidden"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-7 lg:mt-7 2xl:mt-9 text-center text-xs text-steel-400">
                &copy; <span id="footerYear">2026</span> All Rights Reserved &mdash; Desenvolvido com ☕ por <a
                    href="https://www.linkedin.com/in/davi-almeidaa/" target="_blank" rel="noopener noreferrer"
                    class="text-nexo-500 hover:text-nexo-600 font-medium transition-colors">Davi Almeida</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('footerYear').textContent = new Date().getFullYear();
    </script>

    <script src="/js/login.js"></script>
</body>

</html>
